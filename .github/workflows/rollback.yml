name: rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to restore
        required: true

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Validate commit SHA
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::The SHA must be 40 lowercase hex characters"; exit 1; }

      - name: Switch to the selected version
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: sudo -n /usr/local/sbin/gochina-docs-switch "$TARGET_SHA"
