name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      SITE_URL: https://docs.gochina.cool
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:content

      - name: Build
        run: npm run build
        env:
          PUBLIC_ENV: production
          PUBLIC_BUILD_SHA: ${{ github.sha }}

      - name: Upload release
        run: rsync -a dist/ "/www/deploy/gochina-docs/${GITHUB_SHA}/"

      - name: Switch live version
        run: sudo -n /usr/local/sbin/gochina-docs-switch "$GITHUB_SHA"

      - name: Smoke test
        run: |
          for i in $(seq 1 6); do
            if curl -fsS "$SITE_URL/" | grep -q "$GITHUB_SHA" \
              && curl -fsS -o /dev/null "$SITE_URL/manual/getting-started/start/" \
              && curl -fsS -o /dev/null "$SITE_URL/pagefind/pagefind.js"; then
              echo "The new version is live"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The new version is not live. Check the server or run rollback."
          exit 1
